<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports | Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <nav class="navbar w-full z-50 mb-8">
        <div class="max-w-6xl mx-auto px-5 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-6">
                <a href="index.html" class="text-lg font-semibold tracking-tight">FinanceTracker</a>
                <a href="loans.html" class="font-medium">Loans</a>
                <a href="debts.html" class="font-medium">Debts</a>
                <a href="reports.html" class="font-medium text-purple-600">Reports</a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto px-4 py-6">
        <h1 class="text-2xl font-bold mb-6">Reports</h1>
        <div class="bg-white rounded-lg shadow-md p-6">
            <p class="text-gray-500 mb-4">Summary of your financial status:</p>
            <div id="report-summary" class="mb-6"></div>
        </div>
    </div>
    <script>
        // Load loans and debts from localStorage
        const loans = JSON.parse(localStorage.getItem('loans')) || [];
        const debts = JSON.parse(localStorage.getItem('debts')) || [];
        const totalOwed = loans.reduce((sum, loan) => sum + loan.principal, 0);
        const totalReceivable = debts.reduce((sum, debt) => sum + debt.amount, 0);
        const netBalance = totalReceivable - totalOwed;
        const reportSummary = document.getElementById('report-summary');
        reportSummary.innerHTML = `
            <div class="mb-2">Total I Owe: <span class="font-semibold text-red-600">₹${totalOwed.toLocaleString('en-IN', {minimumFractionDigits: 2})}</span></div>
            <div class="mb-2">Total Owed to Me: <span class="font-semibold text-green-600">₹${totalReceivable.toLocaleString('en-IN', {minimumFractionDigits: 2})}</span></div>
            <div class="mb-2">Net Balance: <span class="font-semibold ${netBalance >= 0 ? 'text-green-600' : 'text-red-600'}">₹${netBalance.toLocaleString('en-IN', {minimumFractionDigits: 2})}</span></div>
            <div class="mt-4 text-sm text-gray-700">
                ${netBalance > 0 ? 'You are net positive.' : netBalance < 0 ? 'You are net negative.' : 'You are balanced.'}
            </div>
        `;
    </script>
</body>
</html>
