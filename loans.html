<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loans | Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <nav class="navbar w-full z-50 mb-8">
        <div class="max-w-6xl mx-auto px-5 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-6">
                <a href="index.html" class="text-lg font-semibold tracking-tight">FinanceTracker</a>
                <a href="loans.html" class="font-medium text-purple-600">Loans</a>
                <a href="debts.html" class="font-medium">Debts</a>
                <a href="reports.html" class="font-medium">Reports</a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto px-4 py-6">
        <h1 class="text-2xl font-bold mb-6">Loans I Owe</h1>
        <div id="loans-list" class="bg-white rounded-lg shadow-md p-6">
            <!-- Loans will be listed here by JS -->
        </div>
    </div>
    <script>
        // Load loans from localStorage
        const loans = JSON.parse(localStorage.getItem('loans')) || [];
        const loansList = document.getElementById('loans-list');
        if (loans.length === 0) {
            loansList.innerHTML = '<p class="text-gray-500">No loans found.</p>';
        } else {
            loansList.innerHTML = loans.map(loan => `
                <div class="mb-4 border-b pb-4">
                    <div class="flex justify-between">
                        <div>
                            <span class="font-semibold">${loan.lender}</span>
                            <span class="ml-2 text-gray-500">₹${loan.principal}</span>
                        </div>
                        <span class="text-xs px-2 py-1 rounded bg-blue-100 text-blue-800">${loan.status}</span>
                    </div>
                    <div class="text-sm text-gray-600">Due: ${loan.dueDate}</div>
                    <div class="text-sm text-gray-600">EMI: ₹${loan.emi} | Interest: ${loan.interestRate}%</div>
                    <div class="text-xs text-gray-400">${loan.notes}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
